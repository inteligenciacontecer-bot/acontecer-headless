# ──────────────────────────────────────────────────────────────────────────────
# Fail2Ban filter — nginx-wp-auth
# Detecta intentos de acceso a rutas WordPress en un sitio headless.
# Cualquier acceso a wp-login.php / xmlrpc.php es un ataque o bot;
# el sitio Next.js redirige estas rutas con 301/302.
# ──────────────────────────────────────────────────────────────────────────────

[INCLUDES]
before = common.conf

[Definition]

# Captura IPs que tocan wp-login.php o xmlrpc.php (cualquier método/código)
failregex = ^<HOST> -.*"(GET|POST|HEAD) /wp-login\.php
            ^<HOST> -.*"(GET|POST|HEAD) /xmlrpc\.php
            ^<HOST> -.*"(GET|POST|HEAD) /wp-admin/

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
