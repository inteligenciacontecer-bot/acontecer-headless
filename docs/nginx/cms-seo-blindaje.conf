# ═════════════════════════════════════════════════════════════════════════════
# SEO Blindaje CMS — cms.acontecer.co.cr  (v2 — redirect 301 paths frontend)
# Subdominio backend headless: WordPress + REST API consumido por Next.js
# ═════════════════════════════════════════════════════════════════════════════

# 1. X-Robots-Tag global por default: noindex, nofollow, nosnippet, noarchive
add_header X-Robots-Tag "noindex, nofollow, nosnippet, noarchive" always;

# 2. Sitemaps del CMS → 404 explícito
location ~* ^/(sitemap_index\.xml|.*-sitemap.*\.xml|wp-sitemap.*\.xml|sitemap.*\.xsl)$ {
    add_header X-Robots-Tag "noindex" always;
    return 404;
}

# 3. Feeds RSS/Atom del CMS → 404
location ~* /feed/?$ {
    return 404;
}

# 4. API REST — sobreescribir a solo noindex (permite crawling de SSR Next.js)
location ^~ /wp-json/ {
    add_header X-Robots-Tag "noindex" always;
    try_files $uri $uri/ /index.php?$args;
}

# 5. Uploads (imágenes) — noindex + cache largo
location ^~ /wp-content/uploads/ {
    add_header X-Robots-Tag "noindex" always;
    expires max;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# 6+7. wp-admin / wp-login: SIN location propio aquí (server-level X-Robots-Tag los cubre)

# 8. robots.txt físico: ya manejado por el server block principal

# 9. ── REDIRECT 301 PATHS FRONTEND → DOMINIO PRINCIPAL ───────────────────────
#    Captura URLs públicas del CMS que aún están indexadas/enlazadas y las
#    canonicaliza al dominio principal preservando el path completo.
#    Ejemplos:
#      cms.acontecer.co.cr/nacionales/foo-slug/  → acontecer.co.cr/nacionales/foo-slug/
#      cms.acontecer.co.cr/categoria/deportes    → acontecer.co.cr/categoria/deportes
#      cms.acontecer.co.cr/author/editor/        → acontecer.co.cr/author/editor/
#                                                  (luego Next.js redirige /author/ → /autor/)
#
#    NO afecta wp-admin, wp-json, wp-content, archivos estáticos (.css, .js, etc.)
#    porque están declarados con prefix match `^~` o con regex específico arriba.

# 9a. Raíz exacta
location = / {
    return 301 https://acontecer.co.cr$request_uri;
}

# 9b. Paths frontend (regex case-insensitive — alta prioridad por ser regex)
#     Incluye categorías de Acontecer + rutas legacy WP (author, tag, etiqueta, nota, page)
location ~* ^/(nacionales|internacionales|deportes|economia|entretenimiento|salud|tecnologia|opinion|turismo|tendencias|categoria|autor|author|nota|stories|asamblea|buscar|nosotros|contacto|pauta|agencia|politicas|privacidad|etiqueta|tag|page)(/|$) {
    return 301 https://acontecer.co.cr$request_uri;
}
