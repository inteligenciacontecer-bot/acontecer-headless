# START OF NGINX CONFIG
#XCLOUD 7G LOG FORMATER

#XCLOUD 8G LOG FORMATER

# XCLOUD CONFIG BEFORE
include xcloud-conf/cms.acontecer.co.cr/before/*;

# Fastcgi cache path
fastcgi_cache_path /etc/nginx/cache/cms.acontecer.co.cr levels=1:2 keys_zone=cms.acontecer.co.cr:100m inactive=60m;
# End of Fastcgi cache path


server {
    # Ports to listen on
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;
    listen [::]:443 quic;

    # Add Alt-Svc header to advertise HTTP/3 support to clients
    ssl_early_data on;
    add_header Alt-Svc 'h3=":443"; ma=86400';

    # Server name to listen for
    server_name cms.acontecer.co.cr;

    # Path to document root
    root /var/www/cms.acontecer.co.cr;



    # Paths to certificate files.
    ssl_certificate /etc/letsencrypt/live/cms.acontecer.co.cr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.acontecer.co.cr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # File to be used as index
    index index.php index.html;

    # XCLOUD CONFIG SERVER
    include xcloud-conf/cms.acontecer.co.cr/server/*;

    location /tts/ {
        proxy_pass http://127.0.0.1:5050/tts;
        proxy_set_header Host $host;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~* ^.+\.(ogg|ogv|svg|svgz|eot|otf|woff|woff2|mp4|ttf|ttc|rss|atom|jpg|jpeg|gif|png|ico|webp|zip|tgz|gz|rar|bz2|doc|xls|exe|ppt|tar|mid|midi|wav|bmp|rtf|css|js)$ {
        access_log off; log_not_found off; expires max; add_header Cache-Control "public";
    }

    location ~* /\.(?!well-known\/) {
        deny all;
    }

    location ~\.(ini|log|conf)$ {
        deny all;
    }

    # Deny access to any files with a .php extension in the uploads directory
    location ~* /(?:uploads|files)/.*\.php$ {
        deny all;
    }

    location = /xmlrpc.php {
        deny all;
    }

    # Overrides logs defined in nginx.conf, allows per site logs.
    access_log /var/log/nginx/cms.acontecer.co.cr-access.log;
    error_log /var/log/nginx/cms.acontecer.co.cr-error.log;
# The key to use when saving cache files, which will run through the MD5 hashing algorithm.
    # Cache based on URI only (ignore query strings in cache key)
    fastcgi_cache_key "$scheme$request_method$host$cache_key_uri";

    # If an error occurs when communicating with FastCGI server, return cached content.
    # Useful for serving cached content if the PHP process dies or timeouts.
    fastcgi_cache_use_stale error timeout updating invalid_header http_500;

    # Allow caching of requests which contain the following headers.
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;

    # Show the cache status in server responses.
    add_header Fastcgi-Cache $upstream_cache_status;

    # Don't skip by default
    set $skip_cache 0;

    # POST requests should always go to PHP
    if ($request_method = POST) {
        set $skip_cache 1;
    }

    # Skip cache if query string contains ANY non-ignored parameters
    # This allows caching URLs with ONLY tracking params (utm_*, fbclid, etc.)
    # Matches both key=value and flag-style parameters
    if ($query_string ~* "(^|&)(?!(__s|_ga|_ke|[a-zA-Z0-9_-]+_sid|adgroupid|age-verified|ao_noptimize|campaignid|ck_subscriber_id|cn-reloaded|dclid|epik|fb_action_ids|fb_action_types|fb_source|fbclid|gclid|jobid|mc_cid|mc_eid|mkt_tok|msclkid|ref|session_[a-zA-Z0-9_-]+_alive|sseid|sslid|usqp|utm_[a-zA-Z0-9_-]+)(=|&|$))[^&=]+(=|&|$)") {
        set $skip_cache 1;
    }

    # Don't cache URIs containing the following segments
    if ($request_uri ~* "/wp-admin/|/wp-json/|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml|/cart/|/checkout/|/my-account/|ao_noptirocket|ao_speedup_cachebuster|removed_item|/my-account|/wc-api|/edd-api|/wp-json|/wp-admin|/wp-login") {
        set $skip_cache 1;
    }

    # Don't use the cache for logged in users or recent commenters
    if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in|edd_items_in_cart|woocommerce_items_in_cart|fct_cart_hash|comment_|woocommerce_|wordpress|xf_|edd_|jetpack|yith_wcwl_session_|yith_wrvp_|wpsc_|ecwid|ec_|bookly") {
        set $skip_cache 1;
    }

    location ~ \.php$ {
            try_files $uri =404;
            fastcgi_buffer_size 128k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_buffers 4 256k;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/var/run/php/php8.3-fpm-u4_acontecer.sock;
            fastcgi_cache_bypass $skip_cache;
        fastcgi_no_cache $skip_cache;
        fastcgi_cache cms.acontecer.co.cr;
        fastcgi_cache_valid 200 60m;
        add_header X-Cache $upstream_cache_status;
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

            add_header Alt-Svc 'h3=":443"; ma=86400' always;
                fastcgi_index index.php;
        include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Manually set these params for HTTP/3 support to avoid undefined variable issues
    fastcgi_param HTTP_HOST $host;
    fastcgi_param SERVER_NAME $host;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTPS $https if_not_empty;
        # XCLOUD CONFIG PHP
        include xcloud-conf/cms.acontecer.co.cr/php/*;
    }

    # Rewrite robots.txt
    rewrite ^/robots.txt$ /index.php last;


}
# Redirect http to https
server {
   listen 80;
   listen [::]:80;
   server_name cms.acontecer.co.cr;
   return 301 https://cms.acontecer.co.cr$request_uri;
}

# Redirect www to non-www ssl
server {
    listen 80;
    listen [::]:80;
    server_name www.cms.acontecer.co.cr;
    return 301 https://cms.acontecer.co.cr$request_uri;
}

# Redirect www to non-www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;
    listen [::]:443 quic;

    # Add Alt-Svc header to advertise HTTP/3 support to clients
    ssl_early_data on;
    add_header Alt-Svc 'h3=":443"; ma=86400';
    server_name www.cms.acontecer.co.cr;
            # Paths to certificate files.
        ssl_certificate /etc/letsencrypt/live/cms.acontecer.co.cr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/cms.acontecer.co.cr/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_dhparam /etc/nginx/dhparams.pem;
        return 301 https://cms.acontecer.co.cr$request_uri;
}

# XCLOUD CONFIG AFTER
include xcloud-conf/cms.acontecer.co.cr/after/*;
# END OF NGINX CONFIG
