# acontecer.co.cr → Next.js en localhost:3000
# Next.js maneja internamente: /wp-content/ → cms, /wp-json/ → redirect, etc.

upstream nextjs_acontecer {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTPS principal ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;
    listen [::]:443 quic;

    server_name acontecer.co.cr www.acontecer.co.cr;

    ssl_certificate     /etc/letsencrypt/live/acontecer.co.cr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acontecer.co.cr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_dhparam         /etc/nginx/dhparams.pem;
    ssl_early_data      on;

    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    server_tokens off;

    access_log  /var/log/nginx/acontecer.co.cr-access.log;
    error_log   /var/log/nginx/acontecer.co.cr-error.log;

    # Archivos estáticos de Next.js (_next/static) – servidos directo del disco
    location /_next/static/ {
        alias /var/www/acontecer-headless/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }


    # ── Imágenes del CMS: indexables desde el dominio canónico ─────────────
    # Sobrescribe el X-Robots-Tag: noindex que viene del backend CMS.
    # Google Imágenes indexa estas URLs como propiedad de acontecer.co.cr.
    # NO afecta a cms.acontecer.co.cr/wp-content/uploads/ que sigue noindex.
    location /wp-content/uploads/ {
        proxy_pass         http://nextjs_acontecer;
        proxy_http_version 1.1;

        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Port   443;
        proxy_set_header   X-Forwarded-Host   $host;

        # Quitar el X-Robots-Tag heredado del backend (CMS)
        proxy_hide_header  X-Robots-Tag;

        # Permitir indexación explícita desde el dominio canónico
        add_header X-Robots-Tag "all" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        # Cache largo (imágenes son inmutables)
        expires 30d;
        access_log off;
    }

    # Todo lo demás → Next.js (incluye /wp-content/, /wp-json/, etc.)
    location / {
        proxy_pass         http://nextjs_acontecer;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Port   443;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Host   $host;

        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;

        proxy_buffer_size         128k;
        proxy_buffers             4 256k;
        proxy_busy_buffers_size   256k;
    }
}

# ─── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name acontecer.co.cr www.acontecer.co.cr;
    return 301 https://acontecer.co.cr$request_uri;
}
