# acontecer.co.cr → Next.js en localhost:3000
# Next.js maneja internamente: /wp-content/ → cms, /wp-json/ → redirect, etc.

upstream nextjs_acontecer {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ─── HTTPS principal ──────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;
    listen [::]:443 quic;

    server_name acontecer.co.cr www.acontecer.co.cr;

    ssl_certificate     /etc/letsencrypt/live/acontecer.co.cr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/acontecer.co.cr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_dhparam         /etc/nginx/dhparams.pem;
    ssl_early_data      on;

    add_header Alt-Svc 'h3=":443"; ma=86400';
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    server_tokens off;

    access_log  /var/log/nginx/acontecer.co.cr-access.log;
    error_log   /var/log/nginx/acontecer.co.cr-error.log;

    # Archivos estáticos de Next.js (_next/static) – servidos directo del disco
    location /_next/static/ {
        alias /var/www/acontecer-headless/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
        access_log off;
    }


    # ── Imágenes del CMS: sirve directo desde filesystem con fallback ──────
    # 1. Sirve la imagen del filesystem del CMS WordPress (más rápido, sin proxy)
    # 2. Si no existe → fallback a /imagen-no-disponible.jpg (placeholder branded)
    # 3. X-Robots-Tag: all → indexable en Google Imágenes desde el dominio canónico
    # ── Imágenes del CMS: sirve directo desde filesystem con fallback ──────
    # 1. Sirve la imagen del filesystem del CMS WordPress (más rápido que proxy)
    # 2. Si no existe (404) → error_page redirige a /imagen-no-disponible.jpg con status 200
    # 3. X-Robots-Tag: all → indexable en Google Imágenes desde dominio canónico
    location /wp-content/uploads/ {
        alias /var/www/cms.acontecer.co.cr/wp-content/uploads/;

        # Si la imagen no existe → servir fallback con status 200 (no 404)
        error_page 404 = @uploads_fallback;

        add_header X-Robots-Tag "all" always;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        expires 30d;
        access_log off;
    }

    # Fallback servido cuando una imagen del CMS no existe
    location @uploads_fallback {
        internal;
        root /var/www/acontecer-headless/public;
        try_files /imagen-no-disponible.jpg =404;
        add_header Content-Type "image/jpeg" always;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;
        access_log off;
    }

    # Fallback accesible directamente (para verificación)
    location = /imagen-no-disponible.jpg {
        root /var/www/acontecer-headless/public;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;
        access_log off;
        expires 1d;
    }

    # Todo lo demás → Next.js (incluye /wp-content/, /wp-json/, etc.)
    location / {
        proxy_pass         http://nextjs_acontecer;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade            $http_upgrade;
        proxy_set_header   Connection         "upgrade";
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;
        proxy_set_header   X-Forwarded-Port   443;
        proxy_set_header   X-Forwarded-Host   $host;
        proxy_set_header   X-Forwarded-Host   $host;

        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;

        proxy_buffer_size         128k;
        proxy_buffers             4 256k;
        proxy_busy_buffers_size   256k;
    }
}

# ─── HTTP → HTTPS ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name acontecer.co.cr www.acontecer.co.cr;
    return 301 https://acontecer.co.cr$request_uri;
}
